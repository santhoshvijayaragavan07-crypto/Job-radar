name: Daily Job Radar

on:
  schedule:
    - cron: "30 0 * * *"   # every day at 6:00 AM IST (00:30 UTC)
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scrape_jobs.py
      - name: Save updated dashboard
        run: |
          git config user.name "job-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html jobs.csv data/jobs.json
          git commit -m "Job update $(date -u +%Y-%m-%d)" || echo "No changes today"
          git push
          
